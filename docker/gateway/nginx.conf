events {
    worker_connections 4096;
}

http {
    # -------------------------------------------------------------------------
    # Edge Rate Limiting: 100 requests/second per IP with burst allowance of 20
    # -------------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_req_status 429;

    upstream backend_nodes {
        server flashscale-app:8080 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    server {
        listen 80;
        server_name localhost;

        # Edge Rate Limiting
        limit_req zone=api_limit burst=20 nodelay;

        # Timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;

        location / {
            proxy_pass http://backend_nodes;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Traceability
            proxy_set_header X-Request-ID $request_id;
        }

        # Health endpoint bypasses rate limiting
        location /actuator/health {
            proxy_pass http://backend_nodes/actuator/health;
        }
    }
}
